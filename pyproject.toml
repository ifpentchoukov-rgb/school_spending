[project]
name = "school-budget-tracker"
version = "0.1.0"
description = "Daily extractor + verification system for FY27 US school district budget adoption events."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "supabase>=2.5",
    "tenacity>=8.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["extractors*", "runner*"]
exclude = ["legacy*", "tests*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
