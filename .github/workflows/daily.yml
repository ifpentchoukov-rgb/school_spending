name: Daily extractor run

on:
  schedule:
    # 06:00 UTC daily (PLAN.md §5).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Calendar fiscal year (default 2027)"
        required: false
        default: "2027"
      include_actuals:
        description: "Also run actuals extractors (default false)"
        type: boolean
        required: false
        default: false
      states:
        description: "Optional: space-separated state postals to limit to"
        required: false
        default: ""

jobs:
  daily:
    name: Run daily extractors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write  # for the broken-extractor monitoring workflow (Phase 4 follow-up)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdbtools (CA SACS .exe → .mdb extraction)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + deps
        run: pip install -e ".[dev]"

      - name: Run daily extractor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m runner.daily \
            --fiscal-year "${{ github.event.inputs.fiscal_year || '2027' }}" \
            --triggered-by "${{ github.event_name == 'workflow_dispatch' && 'manual' || 'cron' }}" \
            ${{ github.event.inputs.include_actuals == 'true' && '--include-actuals' || '' }} \
            ${{ github.event.inputs.states && format('--states {0}', github.event.inputs.states) || '' }}

      - name: Upload daily summary
        if: always()  # capture summary even if extractor exit code is non-zero
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary-${{ github.run_id }}
          path: daily_summary.md
          retention-days: 30

      - name: Check for repeated extractor failures
        id: check_failures
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python -m runner.check_failures --consecutive 2 > failures.md
          code=$?
          set -e
          cat failures.md
          if [ "$code" -ne 0 ]; then
            echo "needs_alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update GitHub Issue on repeated failures
        if: always() && steps.check_failures.outputs.needs_alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Extractor failures detected (auto)"
          # Reuse an existing open issue with the same title; otherwise create one.
          existing=$(gh issue list -R "${{ github.repository }}" \
            --search "in:title \"$title\"" --state open --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "appending comment to issue #$existing"
            gh issue comment "$existing" -R "${{ github.repository }}" --body-file failures.md
          else
            echo "opening new issue"
            gh issue create -R "${{ github.repository }}" \
              --title "$title" \
              --body-file failures.md \
              --label "bug,extractor-failure"
          fi
